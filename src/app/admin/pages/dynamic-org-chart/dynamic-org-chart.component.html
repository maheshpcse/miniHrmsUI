<section class="panel"><h2>Onboarding journey</h2><div class="timeline-row" *ngFor="let step of EmpProcessData"><div><strong>{{step.approvedFullName || step.approvedBy || step.rejectedBy || "Awaiting review"}}</strong><p>{{step.approvedRemarks || step.rejectedRemarks || "No remarks added"}}</p></div></div><p class="muted" *ngIf="!EmpProcessData?.length">No onboarding events have been recorded.</p></section>
